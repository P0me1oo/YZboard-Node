name: CI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：要发布的固定 Git Tag，例如 v1.13-yz.3；留空仅验证所选 ref"
        required: false
        type: string
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Verify fixed release source
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+-yz\.[0-9]+$ ]]; then
              echo "release_tag must match v<upstream>-yz.<patch>" >&2
              exit 1
            fi
            tag_sha=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
            if [[ "$source_sha" != "$tag_sha" ]]; then
              echo "checked out commit does not match ${RELEASE_TAG}" >&2
              exit 1
            fi
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: Run tests
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: Build
        env:
          VERSION: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || needs.test.outputs.source_sha }}
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            make build-linux
          else
            make build-linux-arm64
          fi

      - name: Upload xboard-node artifact
        uses: actions/upload-artifact@v4
        with:
          name: xboard-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xboard-node-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload xbctl artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xbctl-${{ matrix.goos }}-${{ matrix.goarch }}

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/p0me1oo/yzboard-node:${{ needs.test.outputs.source_sha }}
            ${{ (inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')) && 'ghcr.io/p0me1oo/yzboard-node:latest' || '' }}
            ${{ inputs.release_tag != '' && format('ghcr.io/p0me1oo/yzboard-node:{0}', inputs.release_tag) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/p0me1oo/yzboard-node:{0}', github.ref_name) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.test.outputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || needs.test.outputs.source_sha }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Add installer to release
        run: install -m 0755 install.sh dist/install.sh
      - name: Generate checksums
        working-directory: dist
        run: sha256sum xboard-node-linux-amd64 xboard-node-linux-arm64 xbctl-linux-amd64 xbctl-linux-arm64 install.sh > SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'dev' }}
          make_latest: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/') }}
          files: |
            dist/xboard-node-linux-amd64
            dist/xboard-node-linux-arm64
            dist/xbctl-linux-amd64
            dist/xbctl-linux-arm64
            dist/install.sh
            dist/SHA256SUMS
